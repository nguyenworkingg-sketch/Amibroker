name: Kiểm thử & triển khai GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cài thư viện exporter
        run: pip install pandas PyYAML psutil
      - name: Kiểm thử exporter (Python)
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Cài thư viện frontend
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Kiểm tra kiểu
        working-directory: frontend
        run: npm run typecheck
      - name: Kiểm thử frontend
        working-directory: frontend
        run: npm test
      - name: Build (base /Amibroker/, kèm data/)
        working-directory: frontend
        run: npm run build
      - name: Kiểm tra bản build
        run: |
          test -f frontend/dist/index.html
          grep -q '/Amibroker/assets/' frontend/dist/index.html
          if [ -f data/meta.json ]; then test -f frontend/dist/data/meta.json; fi
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: frontend/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
